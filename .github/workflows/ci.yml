# CI: runs on every pull request and on every push to main.
# The job "test" is a required check on main: a pull request cannot be merged until it is green.
# Do not rename the job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets you run CI by hand from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Installa dipendenze da requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Esegui test automatici (pytest)
        env:
          MPLBACKEND: Agg
        run: |
          pytest
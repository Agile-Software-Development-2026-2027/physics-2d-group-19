# CI: runs on every pull request and on every push to main.
# The job "test" is a required check on main: a pull request cannot be merged until it is green.
# Do not rename the job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets you run CI by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=60

  frontend:
    name: frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build

  test:
    # Required check: passes only if every job in "needs" succeeded (or was skipped on purpose).
    name: test
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All jobs passed"
